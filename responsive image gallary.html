<!DOCTYPE html>
<html>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
}

.header {
  text-align: center;
  padding: 32px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  padding: 0 4px;
}


.column {
  flex: 25%;
  max-width: 25%;
  padding: 0 4px;
}

.column img {
  margin-top: 8px;
  vertical-align: middle;
}


@media screen and (max-width: 800px) {
  .column {
    flex: 50%;
    max-width: 33% 33% 33%;
  }
}


@media screen and (max-width: 600px) {
  .column {
    flex: 100%;
    max-width: 100%;
  }
}
</style>
<body>
<title>resonsive image Gallery</title>

<div class="header">
  <h1>Responsive Image Gallery</h1>
  <p>Resize the browser window to see the responsive effect.</p>
</div>


<div class="container"> 
  <div class="column">
   <div class="column">
    <img src="image copy 12.png" style="width:100%">
    <img src="image copy 11.png" style="width:100%">
    <img src="image copy 10.png" style="width:100%">
    <img src="image copy 9.png" style="width:100%">
    <img src="image copy 8.png" style="width:100%">
    <img src="image copy 7.png" style="width:100%">
  </div>
  
   
  <div class="column">
    <img src="image copy 12.png" style="width:100%">
    <img src="image copy 11.png" style="width:100%">
    <img src="image copy 10.png" style="width:100%">
    <img src="image copy 9.png" style="width:100%">
    <img src="image copy 8.png" style="width:100%">
    <img src="image copy 7.png" style="width:100%">
  </div>
  
  <div class="column">
    <img src="image copy 12.png" style="width:100%">
    <img src="image copy 11.png" style="width:100%">
    <img src="image copy 10.png" style="width:100%">
    <img src="image copy 9.png" style="width:100%">
    <img src="image copy 8.png" style="width:100%">
    <img src="image copy 7.png" style="width:100%">
  </div>
</div>

</body>
</html>

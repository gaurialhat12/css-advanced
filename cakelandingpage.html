<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
    height: 100vh;
    width: 100wh;
    background-image: linear-gradient(rgba(0,0,20,0)), url('./images/360_F_105907729_4RzHYsHJ2UFt5koUI19fc6VzyFPEjeXe.jpg');
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
}

.head{
    background-color: rgb(190, 190, 190);
    border-radius: 30px;
    display: flex;
    /* padding-left: 4px; */
    justify-content: space-between;
}

nav ul{
    display: flex;
    list-style-type: none;
    gap: 10px;
}

nav ul li{
    color: black;
    cursor: pointer;
    border: 2px solid gray;
    border-radius:0px 10px;
    padding: 3px;
    width: 100px;
    background-image:linear-gradient(45deg,white,hotpink) ;
}

.search{
    display: flex;
    align-items: center;
    && input{
        height: 30px;
        width: 400px;
        border-radius: 30px;
    }
}


.logo-img{
    display: flex;
    align-items: center;
    height: 50px;
    border-radius: 100%;
}

.logo{
    display: flex;
    margin-left: 4px;
    align-items: center;
}

.home{
    display: flex;
    align-items: center;
    padding: 3px;
}

.content{
    /* color: black; */
    background-image: linear-gradient(45deg,hotpink,white);
    && .title{
        font-size: 40px;
    }
    font-size: 30px;
    background-color: transparent;
    border: 3px solid white;
    border-radius: 30px;
    padding: 10px;
    box-shadow: 0px 0px 9px 0px gray;
}

.sideimg{
    height: 500px;
}

.btn{
    height: 35px;
    width: 100px;
    border-radius: 50px;
    border: 2px solid black;
    box-shadow: 0px 0px 10px 0px black;
    margin-left: 50%;
    cursor: pointer;
}

.btn:hover{
    background-color: hotpink;
    transition-duration: .6s;
    scale: calc(1.1);
}

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cake shop Landing page</title>
    <link rel="stylesheet" href="image copy 18.png">
</head>
<body>
    <div class="main">
        <head>
            <div class="head">
                <div class="logo">
                    <img class="logo-img" src="https://img.freepik.com/premium-vector/sweet-cake-bakery-shop-logo_807399-1051.jpg?w=2000" alt="LOGO">
                </div>
                <div class="search">
                    <input type="text" name="" id="" placeholder="search">
                </div>
                <nav>
                    <ul>
                        <li>Home</li>
                        <li>About</li>
                        <li>Shop</li>
                        <li>contact</li>
                    </ul>
                </nav>
            </div>

            <div class="home">
                <div class="content">
                    <div class="title">Welcome !</div>
                    <div class="des">“Frosted cheer. Baked with memory.”</div>
                    <button class="btn">Read more</button>
                </div>
                <div class="imagediv"><img class="sideimg" src="https://th.bing.com/th/id/OIP.tUpqbgmLbXZmralzNYE-KAHaHi?w=193&h=197&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="https://th.bing.com/th/id/OIP.tUpqbgmLbXZmralzNYE-KAHaHi?w=193&h=197&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"></div>
            </div>
        </head>
    </div>
</body>
</html>

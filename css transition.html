<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: rgb(207, 150, 162);
            transition: width 5s, height 5s, background-color 5s, box-transition 5s;
        }
        div:hover{
            width: 300px;
            height: 300px;
            background-color: orange;
        }
    
        
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transitions</title>
</head>
<body>
    <h1> css transition</h1>
    <p> css transition</p>
    <div></div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
#img1 {
  filter: blur(2px);
}

#img2 {
  filter: blur(6px);
}
</style>
</head>
<body>
<title>image blur effect</title>
<h1>The blur() Function</h1>

<p>blur(2px):</p>
<img id="img1" src="image copy 15.png" alt="Pineapple" width="300" height="300">

<p>blur(6px):</p>
<img id="img2" src="image copy 15.png" alt="Pineapple" width="300" height="300">

<p>Original image:</p>
<img src="image copy 15.png" alt="Pineapple" width="300" height="300">

</body>
</html>
